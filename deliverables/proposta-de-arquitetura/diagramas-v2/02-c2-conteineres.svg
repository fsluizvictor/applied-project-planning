2D3748" text-anchor="middle">abre e encerra a sessão</text><text x="550.0" y="429.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11" fill="#5A6270" font-style="italic" text-anchor="middle">[HTTP, multipart e JSON]</text><rect x="460.5" y="519.5" width="179.0" height="51.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="550.0" y="534.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">Devolve texto, áudio WAV</text><text x="550.0" y="549.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">(base64) e três blocos</text><text x="550.0" y="564.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11" fill="#5A6270" font-style="italic" text-anchor="middle">[JSON]</text><rect x="870.0" y="587.0" width="146.0" height="36.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="943.0" y="602.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">Lê a cada chamada</text><text x="943.0" y="617.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11" fill="#5A6270" font-style="italic" text-anchor="middle">[sistema de arquivos]</text><rect x="1051.9" y="414.5" width="216.2" height="51.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="1160.0" y="429.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">Transcreve, gera fala</text><text x="1160.0" y="444.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">e sintetiza voz</text><text x="1160.0" y="459.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11" fill="#5A6270" font-style="italic" text-anchor="middle">[HTTPS, REST e SDK google-genai]</text></svg>