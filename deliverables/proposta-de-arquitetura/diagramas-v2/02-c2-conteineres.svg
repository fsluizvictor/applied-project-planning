<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="900" viewBox="0 0 1620 900"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/></marker></defs><rect width="1620" height="900" fill="#FFFFFF"/><text x="32.0" y="44.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="24" fill="#14202E" font-weight="700" text-anchor="start">C2 — Diagrama de contêineres (prova de conceito local, como construída)</text><text x="32.0" y="72.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="14" fill="#5A6270" text-anchor="start">Escopo: simulador de entrevista em inglês por voz. Unidades executáveis e armazenamentos.</text><rect x="110" y="130" width="260" height="120" rx="12" fill="#0B3B60" stroke="#072A45" stroke-width="1.6"/><circle cx="240.0" cy="126" r="26" fill="#0B3B60" stroke="#072A45" stroke-width="1.6"/><text x="240.0" y="174.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">Pessoa candidata</text><text x="240.0" y="194.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11.5" fill="#CFE0F1" text-anchor="middle">[Pessoa]</text><text x="240.0" y="222.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">Usa o navegador da própria</text><text x="240.0" y="238.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">máquina</text><rect x="40" y="300" width="1080" height="470" rx="14" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="8 6"/><text x="56.0" y="324.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="14" fill="#2D3748" font-weight="700" text-anchor="start">Máquina local</text><text x="56.0" y="342.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#5A6270" text-anchor="start">[Limite de implantação: 127.0.0.1]</text><rect x="80" y="380" width="360" height="190" rx="12" fill="#438DD5" stroke="#2F6FAE" stroke-width="1.6"/><text x="260.0" y="441.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">Interface web</text><text x="260.0" y="461.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11.5" fill="#E3EEF9" text-anchor="middle">[Contêiner: JavaScript, React, Vite — porta 5173]</text><text x="260.0" y="489.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">Exibe o cenário único, captura o microfone</text><text x="260.0" y="505.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">(MediaRecorder, WebM/Opus), reproduz a voz e</text><text x="260.0" y="521.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">mostra os três blocos</text><rect x="660" y="380" width="400" height="190" rx="12" fill="#438DD5" stroke="#2F6FAE" stroke-width="1.6"/><text x="860.0" y="441.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">API local (BFF)</text><text x="860.0" y="461.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11.5" fill="#E3EEF9" text-anchor="middle">[Contêiner: Python 3.12, FastAPI, Uvicorn — porta 8765]</text><text x="860.0" y="489.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">Um turno por requisição: orquestra ASR, diálogo e</text><text x="860.0" y="505.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">síntese; guarda a chave do modelo e o histórico só em</text><text x="860.0" y="521.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">memória</text><path d="M680,652 a180.0,12 0 0,0 360,0 v86 a180.0,12 0 0,1 -360,0 z" fill="#438DD5" stroke="#2F6FAE" stroke-width="1.6"/><ellipse cx="860.0" cy="652" rx="180.0" ry="12" fill="#438DD5" stroke="#2F6FAE" stroke-width="1.6"/><text x="860.0" y="696.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">Instruções de sistema</text><text x="860.0" y="716.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11.5" fill="#E3EEF9" text-anchor="middle">[Arquivos de texto: prompts/]</text><text x="860.0" y="744.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">entrevistador.txt e feedback.txt</text><rect x="1260" y="380" width="320" height="190" rx="12" fill="#7B8089" stroke="#5C6068" stroke-width="1.6"/><text x="1420.0" y="441.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">API Gemini</text><text x="1420.0" y="461.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11.5" fill="#EEEEEE" text-anchor="middle">[Sistema externo — camada gratuita]</text><text x="1420.0" y="489.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">gemini-3.5-transcribe (ASR);</text><text x="1420.0" y="505.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">gemini-3.5-flash-lite (diálogo e retorno);</text><text x="1420.0" y="521.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">gemini-3.8-flash-lite-tts (síntese)</text><path d="M330,250 L330,380" fill="none" stroke="#4A5568" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M440,440 L660,440" fill="none" stroke="#4A5568" stroke-width="1.7" marker-end="url(#arro