<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1250" viewBox="0 0 1600 1250"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/></marker></defs><rect width="1600" height="1250" fill="#FFFFFF"/><text x="32.0" y="44.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="24" fill="#14202E" font-weight="700" text-anchor="start">Diagrama dinâmico — um turno de voz e o encerramento da sessão</text><text x="32.0" y="72.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="14" fill="#5A6270" text-anchor="start">Sequência real do código: as três chamadas ao provedor ocorrem em série dentro da mesma requisição.</text><path d="M130,165 L130,1170" stroke="#A0AEC0" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="15" y="100" width="230" height="66" rx="12" fill="#438DD5" stroke="#2F6FAE" stroke-width="1.6"/><text x="130.0" y="128.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">Pessoa</text><text x="130.0" y="148.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11.5" fill="#E3EEF9" text-anchor="middle">[quem executa o teste]</text><path d="M390,165 L390,1170" stroke="#A0AEC0" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="275" y="100" width="230" height="66" rx="12" fill="#438DD5" stroke="#2F6FAE" stroke-width="1.6"/><text x="390.0" y="128.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">Interface web</text><text x="390.0" y="148.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11.5" fill="#E3EEF9" text-anchor="middle">[React]</text><path d="M650,165 L650,1170" stroke="#A0AEC0" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="535" y="100" width="230" height="66" rx="12" fill="#438DD5" stroke="#2F6FAE" stroke-width="1.6"/><text x="650.0" y="128.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">API local</text><text x="650.0" y="148.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11.5" fill="#E3EEF9" text-anchor="middle">[FastAPI, BFF]</text><path d="M910,165 L910,1170" stroke="#A0AEC0" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="795" y="100" width="230" height="66" rx="12" fill="#7B8089" stroke="#5C6068" stroke-width="1.6"/><text x="910.0" y="128.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">ASR</text><text x="910.0" y="148.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11.5" fill="#EEEEEE" text-anchor="middle">[gemini-3.5-transcribe]</text><path d="M1170,165 L1170,1170" stroke="#A0AEC0" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="1055" y="100" width="230" height="66" rx="12" fill="#7B8089" stroke="#5C6068" stroke-width="1.6"/><text x="1170.0" y="128.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">Diálogo e retorno</text><text x="1170.0" y="148.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11.5" fill="#EEEEEE" text-anchor="middle">[gemini-3.5-flash-lite]</text><path d="M1430,165 L1430,1170" stroke="#A0AEC0" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="1315" y="100" width="230" height="66" rx="12" fill="#7B8089" stroke="#5C6068" stroke-width="1.6"/><text x="1430.0" y="128.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">Síntese</text><text x="1430.0" y="148.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11.5" fill="#EEEEEE" text-anchor="middle">[gemini-3.8-flash-lite-tts]</text><rect x="40" y="190" width="1520" height="655" rx="8" fill="#F7FAFC" fill-opacity="0.55" stroke="#CBD5E0" stroke-width="1.2"/><rect x="40" y="190" width="284.0" height="24" rx="6" fill="#E2E8F0"/><text x="50.0" y="207.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12.5" fill="#2D3748" font-weight="700" text-anchor="start">Turno — repete-se a cada resposta</text><path d="M130,240 L384,240" fill="none" stroke="#4A5568" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M390,290 L644,290" fill="none" stroke="#4A5568" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M650,332 L684,332 L684,350 L656,350" fill="none" stroke="#4A5568" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M650,395 L904,395" fill="none" stroke="#4A5568" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M910,445 L656,445" fill="none" stroke="#4A5568" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M650,487 L684,487 L684,505 L656,505" fill="none" stroke="#4A5568" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M650,550 L1164,550" fill="none" stroke="#4A5568" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1170,600 L656,600" fill="none" stroke="#4A5568" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M650,655 L1424,655" fill="none" stroke="#4A5568" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1430,705 L656,705" fill="none" stroke="#4A5568" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M650,742 L684,742 L684,760 L656,760" fill="none" stroke="#4A5568" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M650,800 L396,800" fill="none" stroke="#4A5568" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M390,830 L136,830" fill="none" stroke="#4A5568" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="40" y="880" width="1520" height="280" rx="8" fill="#F7FAFC" fill-opacity="0.55" stroke="#CBD5E0" stroke-width="1.2"/><rect x="40" y="880" width="284.0" height="24" rx="6" fill="#E2E8F0"/><text x="50.0" y="897.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12.5" fill="#2D3748" font-weight="700" text-anchor="start">Encerramento — uma vez por sessão</text><path d="M130,935 L384,935" fill="none" stroke="#4A5568" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M390,970 L644,970" fill="none" stroke="#4A5568" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M650,997 L684,997 L684,1015 L656,1015" fill="none" stroke="#4A5568" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M650,1050 L1164,1050" fill="none" stroke="#4A5568" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1170,1095 L656,1095" fill="none" stroke="#4A5568" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M650,1140 L396,1140" fill="none" stroke="#4A5568" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="32.0" y="1215.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="13" fill="#2D3748" font-weight="700" text-anchor="start">Legenda</text><path d="M112,1210 L146,1210" stroke="#4A5568" stroke-width="1.7" marker-end="url(#arrow)"/><text x="154.0" y="1215.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="start">Chamada</text><path d="M232.72,1210 L266.72,1210" stroke="#4A5568" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="274.7" y="1215.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="start">Resposta</text><text x="560.0" y="1215.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#5A6270" text-anchor="start">Latência do turno = ASR + diálogo + síntese + rede. Não foi medida por etapa na sessão-piloto de 20 de novembro de 2026.</text><rect x="187.9" y="216.5" width="144.2" height="21.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="260.0" y="231.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">1. Grava a resposta</text><rect x="402.6" y="266.5" width="234.7" height="21.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="520.0" y="281.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">2. POST /turns (áudio WebM/Opus)</text><rect x="694.0" y="330.5" width="206.9" height="21.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="797.4" y="345.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">3. Valida tamanho (até 8 MB)</text><rect x="624.4" y="371.5" width="311.3" height="21.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="780.0" y="386.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">4. generateContent (áudio, VERBATIM, en-US)</text><rect x="666.1" y="421.5" width="227.8" height="21.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="780.0" y="436.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">5. Transcrição (pode vir vazia)</text><rect x="694.0" y="485.5" width="186.0" height="21.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="787.0" y="500.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">6. Zera o áudio da pessoa</text><rect x="709.1" y="526.5" width="401.8" height="21.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="910.0" y="541.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">7. Instrução da entrevistadora + histórico + transcrição</text><rect x="803.1" y="576.5" width="213.8" height="21.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="910.0" y="591.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">8. Próxima fala, sem correção</text><rect x="908.7" y="631.5" width="262.6" height="21.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="1040.0" y="646.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">9. generateContent (texto, voz Kore)</text><rect x="988.8" y="681.5" width="102.5" height="21.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="1040.0" y="696.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">10. Áudio WAV</text><rect x="694.0" y="740.5" width="304.3" height="21.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="846.2" y="755.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">11. Acrescenta os dois turnos ao histórico</text><rect x="413.1" y="776.5" width="213.8" height="21.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="520.0" y="791.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">12. Transcrição, fala e áudio</text><rect x="191.4" y="806.5" width="137.3" height="21.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="260.0" y="821.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">13. Reproduz a voz</text><rect x="163.5" y="911.5" width="193.0" height="21.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="260.0" y="926.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">14. Clica em End interview</text><rect x="468.8" y="946.5" width="102.5" height="21.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="520.0" y="961.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">15. POST /end</text><rect x="694.0" y="995.5" width="220.8" height="21.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="804.4" y="1010.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">16. Remove a sessão da memória</text><rect x="737.0" y="1026.5" width="346.1" height="21.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="910.0" y="1041.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">17. Instrução de retorno + transcrição acumulada</text><rect x="817.0" y="1071.5" width="186.0" height="21.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="910.0" y="1086.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">18. Texto com três blocos</text><rect x="437.4" y="1116.5" width="165.1" height="21.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="520.0" y="1131.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">19. Três blocos (JSON)</text></svg>