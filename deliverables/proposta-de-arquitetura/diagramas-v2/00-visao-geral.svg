<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="900" viewBox="0 0 1660 900"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/></marker></defs><rect width="1660" height="900" fill="#FFFFFF"/><text x="32.0" y="44.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="24" fill="#14202E" font-weight="700" text-anchor="start">Visão geral — turno de voz em cascata (ASR → LLM → TTS)</text><text x="32.0" y="72.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="14" fill="#5A6270" text-anchor="start">Prova de conceito local: um turno é uma requisição HTTP síncrona; o histórico fica só na memória do processo.</text><rect x="30" y="220" width="170" height="130" rx="12" fill="#0B3B60" stroke="#072A45" stroke-width="1.6"/><circle cx="115.0" cy="216" r="26" fill="#0B3B60" stroke="#072A45" stroke-width="1.6"/><text x="115.0" y="269.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">Pessoa</text><text x="115.0" y="296.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">Fala ao microfone e</text><text x="115.0" y="312.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">ouve a</text><text x="115.0" y="328.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">entrevistadora</text><rect x="270" y="200" width="220" height="150" rx="12" fill="#438DD5" stroke="#2F6FAE" stroke-width="1.6"/><text x="380.0" y="249.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">Interface web</text><text x="380.0" y="269.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11.5" fill="#E3EEF9" text-anchor="middle">[React, Vite]</text><text x="380.0" y="297.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">Cenário único; grava a</text><text x="380.0" y="313.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">resposta e reproduz o áudio</text><rect x="550" y="110" width="1080" height="480" rx="14" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="8 6"/><text x="566.0" y="134.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="14" fill="#2D3748" font-weight="700" text-anchor="start">API local (BFF)</text><text x="566.0" y="152.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#5A6270" text-anchor="start">[Python 3.12, FastAPI] — orquestra o turno em sequência</text><rect x="630" y="200" width="250" height="150" rx="12" fill="#85BBF0" stroke="#5A97D3" stroke-width="1.6"/><text x="755.0" y="249.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" fill="#0B2540" font-weight="700" text-anchor="middle">1. Reconhecimento (ASR)</text><text x="755.0" y="269.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11.5" fill="#173A5E" text-anchor="middle">[gemini-3.5-transcribe, VERBATIM]</text><text x="755.0" y="297.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#0B2540" text-anchor="middle">Converte a fala em texto</text><text x="755.0" y="313.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#0B2540" text-anchor="middle">literal, com hesitações</text><rect x="980" y="200" width="250" height="150" rx="12" fill="#85BBF0" stroke="#5A97D3" stroke-width="1.6"/><text x="1105.0" y="249.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" fill="#0B2540" font-weight="700" text-anchor="middle">2. Diálogo (LLM)</text><text x="1105.0" y="269.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11.5" fill="#173A5E" text-anchor="middle">[gemini-3.5-flash-lite]</text><text x="1105.0" y="297.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#0B2540" text-anchor="middle">Gera a próxima pergunta, sem</text><text x="1105.0" y="313.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#0B2540" text-anchor="middle">corrigir a pessoa</text><rect x="1330" y="200" width="250" height="150" rx="12" fill="#85BBF0" stroke="#5A97D3" stroke-width="1.6"/><text x="1455.0" y="241.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" fill="#0B2540" font-weight="700" text-anchor="middle">3. Síntese (TTS)</text><text x="1455.0" y="261.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11.5" fill="#173A5E" text-anchor="middle">[gemini-3.8-flash-lite-tts, voz</text><text x="1455.0" y="276.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11.5" fill="#173A5E" text-anchor="middle">Kore]</text><text x="1455.0" y="304.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#0B2540" text-anchor="middle">Converte a fala da</text><text x="1455.0" y="320.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#0B2540" text-anchor="middle">entrevistadora em áudio WAV</text><path d="M980,432 a125.0,12 0 0,0 250,0 v96 a125.0,12 0 0,1 -250,0 z" fill="#438DD5" stroke="#2F6FAE" stroke-width="1.6"/><ellipse cx="1105.0" cy="432" rx="125.0" ry="12" fill="#438DD5" stroke="#2F6FAE" stroke-width="1.6"/><text x="1105.0" y="476.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">Histórico da sessão</text><text x="1105.0" y="496.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11.5" fill="#E3EEF9" text-anchor="middle">[memória do processo]</text><text x="1105.0" y="524.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">Apenas papel e texto</text><rect x="630" y="410" width="250" height="140" rx="12" fill="#85BBF0" stroke="#5A97D3" stroke-width="1.6"/><text x="755.0" y="454.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" fill="#0B2540" font-weight="700" text-anchor="middle">Retorno em três blocos</text><text x="755.0" y="474.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11.5" fill="#173A5E" text-anchor="middle">[gemini-3.5-flash-lite]</text><text x="755.0" y="502.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#0B2540" text-anchor="middle">Pontos positivos, de melhoria e</text><text x="755.0" y="518.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#0B2540" text-anchor="middle">próximo passo</text><path d="M200,285 L270,285" fill="none" stroke="#4A5568" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M490,290 L630,290" fill="none" stroke="#4A5568" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M880,275 L980,275" fill="none" stroke="#4A5568" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1230,275 L1330,275" fill="none" stroke="#4A5568" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1455,200 L1455,160 L380,160 L380,200" fill="none" stroke="#4A5568" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1070,350 L1070,420" fill="none" stroke="#4A5568" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1140,420 L1140,350" fill="none" stroke="#4A5568" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M980,480 L880,480" fill="none" stroke="#4A5568" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M420,350 L420,470 L630,470" fill="none" stroke="#4A5568" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M755,550 L755,620 L340,620 L340,350" fill="none" stroke="#4A5568" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="980" y="660" width="600" height="100" rx="12" fill="#7B8089" stroke="#5C6068" stroke-width="1.6"/><text x="1280.0" y="692.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">API Gemini</text><text x="1280.0" y="712.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11.5" fill="#EEEEEE" text-anchor="middle">[Sistema externo — camada gratuita]</text><text x="1280.0" y="740.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">Três chamadas por turno e uma no encerramento</text><path d="M1280,590 L1280,660" fill="none" stroke="#4A5568" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="30" y="660" width="880" height="118" rx="8" fill="#FFF8E1" stroke="#E0C068" stroke-width="1.4"/><text x="46.0" y="686.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="13.5" fill="#3A3220" font-weight="700" text-anchor="start">Restrições que o desenho respeita</text><text x="48.0" y="710.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12.5" fill="#3A3220" text-anchor="start">• O áudio da pessoa é descartado logo após a transcrição; a transcrição fica em memória até o encerramento (RC-04).</text><text x="48.0" y="731.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12.5" fill="#3A3220" text-anchor="start">• Sem banco de dados, fila, cadastro ou canal bidirecional contínuo; a chave do modelo fica só no processo da API</text><text x="48.0" y="749.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12.5" fill="#3A3220" text-anchor="start">   (RC-08).</text><text x="32.0" y="820.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="13" fill="#2D3748" font-weight="700" text-anchor="start">Legenda</text><rect x="112" y="806" width="34" height="18" rx="4" fill="#0B3B60" stroke="#072A45" stroke-width="1.6"/><text x="154.0" y="820.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="start">Pessoa</text><rect x="225.76" y="806" width="34" height="18" rx="4" fill="#438DD5" stroke="#2F6FAE" stroke-width="1.6"/><text x="267.8" y="820.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="start">Contêiner</text><rect x="360.4" y="806" width="34" height="18" rx="4" fill="#85BBF0" stroke="#5A97D3" stroke-width="1.6"/><text x="402.4" y="820.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="start">Componente</text><rect x="502.0" y="806" width="34" height="18" rx="4" fill="#438DD5" stroke="#2F6FAE" stroke-width="1.6"/><text x="544.0" y="820.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="start">Armazenamento</text><rect x="664.48" y="806" width="34" height="18" rx="4" fill="#7B8089" stroke="#5C6068" stroke-width="1.6"/><text x="706.5" y="820.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="start">Sistema externo</text><rect x="840.88" y="806" width="34" height="18" rx="4" fill="none" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="5 4"/><text x="882.9" y="820.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="start">Limite</text><path d="M954.64,815 L988.64,815" stroke="#4A5568" stroke-width="1.7" marker-end="url(#arrow)"/><text x="996.6" y="820.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="start">Fluxo (sentido da seta)</text><text x="32.0" y="882.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11.5" fill="#6B7280" text-anchor="start">Fonte: código do repositório poc-en-simulator (api/app.py, api/gemini_client.py) e DAS v0.2. Nomes de modelos conforme api/settings.py.</text><rect x="215.1" y="257.5" width="39.8" height="21.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="235.0" y="272.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">fala</text><rect x="503.0" y="300.0" width="114.1" height="36.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="560.0" y="315.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">áudio do turno</text><text x="560.0" y="330.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11" fill="#5A6270" font-style="italic" text-anchor="middle">[HTTP multipart]</text><rect x="885.7" y="247.5" width="88.6" height="21.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="930.0" y="262.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">transcrição</text><rect x="1232.2" y="247.5" width="95.5" height="21.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="1280.0" y="262.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">próxima fala</text><rect x="1136.1" y="142.0" width="227.8" height="36.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="1250.0" y="157.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">texto e áudio da entrevistadora</text><text x="1250.0" y="172.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11" fill="#5A6270" font-style="italic" text-anchor="middle">[JSON, WAV em base64]</text><rect x="931.7" y="374.5" width="130.3" height="21.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="996.8" y="389.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">acrescenta turnos</text><rect x="1148.0" y="374.5" width="95.5" height="21.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="1195.8" y="389.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">lê histórico</text><rect x="885.7" y="452.5" width="88.6" height="21.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="930.0" y="467.5" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">ao encerrar</text><rect x="466.8" y="482.0" width="116.4" height="36.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="525.0" y="497.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">encerrar sessão</text><text x="525.0" y="512.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11" fill="#5A6270" font-style="italic" text-anchor="middle">[HTTP]</text><rect x="505.7" y="602.0" width="88.6" height="36.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="550.0" y="617.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">três blocos</text><text x="550.0" y="632.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11" fill="#5A6270" font-style="italic" text-anchor="middle">[JSON]</text><rect x="1290.0" y="607.0" width="116.4" height="36.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="1348.2" y="622.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="middle">generateContent</text><text x="1348.2" y="637.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11" fill="#5A6270" font-style="italic" text-anchor="middle">[HTTPS]</text></svg>