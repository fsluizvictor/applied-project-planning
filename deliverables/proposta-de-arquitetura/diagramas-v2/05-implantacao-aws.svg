<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1010" viewBox="0 0 1720 1010"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/></marker></defs><rect width="1720" height="1010" fill="#FFFFFF"/><text x="32.0" y="44.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="24" fill="#14202E" font-weight="700" text-anchor="start">Diagrama de implantação — publicação proposta na AWS (opcional na Sprint 3)</text><text x="32.0" y="72.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="14" fill="#5A6270" text-anchor="start">Proposta não implantada. Mesmo código da API, executado sem estado; custo previsto dentro do Free plan.</text><rect x="40" y="410" width="210" height="130" rx="12" fill="#0B3B60" stroke="#072A45" stroke-width="1.6"/><circle cx="145.0" cy="406" r="26" fill="#0B3B60" stroke="#072A45" stroke-width="1.6"/><text x="145.0" y="465.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">Pessoa candidata</text><text x="145.0" y="485.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11.5" fill="#CFE0F1" text-anchor="middle">[Navegador]</text><text x="145.0" y="513.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">Acessa por HTTPS</text><rect x="310" y="100" width="1110" height="790" rx="14" fill="none" stroke="#E07B00" stroke-width="1.6" stroke-dasharray="8 6"/><text x="326.0" y="124.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="14" fill="#2D3748" font-weight="700" text-anchor="start">Amazon Web Services</text><text x="326.0" y="142.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#5A6270" text-anchor="start">[Conta no Free plan — região a definir]</text><rect x="350" y="160" width="1030" height="140" rx="8" fill="#FFF8E1" stroke="#E0C068" stroke-width="1.4"/><text x="366.0" y="186.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="13.5" fill="#3A3220" font-weight="700" text-anchor="start">Ajustes no código exigidos por esta implantação</text><text x="368.0" y="210.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12.5" fill="#3A3220" text-anchor="start">• API sem estado: o navegador envia o histórico textual a cada turno, porque instâncias Lambda não compartilham memória.</text><text x="368.0" y="231.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12.5" fill="#3A3220" text-anchor="start">• Endereço da API e CORS configuráveis por ambiente (hoje fixos em 127.0.0.1).</text><text x="368.0" y="252.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12.5" fill="#3A3220" text-anchor="start">• Limite do áudio reduzido para até 4 MB: o payload síncrono da Lambda é de 6 MB e o corpo binário chega codificado em base64.</text><text x="368.0" y="273.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12.5" fill="#3A3220" text-anchor="start">• Tempos-limite por etapa cuja soma fique abaixo de 30 s, o teto da integração do HTTP API (hoje 90 s por chamada).</text><rect x="350" y="380" width="300" height="170" rx="12" fill="#FFFFFF" stroke="#E07B00" stroke-width="2.2"/><text x="500.0" y="431.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" fill="#232F3E" font-weight="700" text-anchor="middle">Amazon CloudFront</text><text x="500.0" y="451.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11.5" fill="#4A5563" text-anchor="middle">[Distribuição — HTTPS]</text><text x="500.0" y="479.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#232F3E" text-anchor="middle">Entrega a interface e encaminha /api/*</text><text x="500.0" y="495.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#232F3E" text-anchor="middle">na mesma origem, sem CORS entre</text><text x="500.0" y="511.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#232F3E" text-anchor="middle">domínios</text><rect x="350" y="660" width="300" height="150" rx="12" fill="#FFFFFF" stroke="#E07B00" stroke-width="2.2"/><text x="500.0" y="717.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" fill="#232F3E" font-weight="700" text-anchor="middle">Amazon S3</text><text x="500.0" y="737.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11.5" fill="#4A5563" text-anchor="middle">[Bucket privado, acesso por OAC]</text><text x="500.0" y="765.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#232F3E" text-anchor="middle">Arquivos estáticos do build Vite</text><rect x="760" y="380" width="290" height="170" rx="12" fill="#FFFFFF" stroke="#E07B00" stroke-width="2.2"/><text x="905.0" y="439.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" fill="#232F3E" font-weight="700" text-anchor="middle">Amazon API Gateway</text><text x="905.0" y="459.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11.5" fill="#4A5563" text-anchor="middle">[HTTP API]</text><text x="905.0" y="487.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#232F3E" text-anchor="middle">Rota /api/*; limite de requisições por</text><text x="905.0" y="503.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#232F3E" text-anchor="middle">rota; integração de até 30 s</text><rect x="760" y="640" width="290" height="200" rx="12" fill="#438DD5" stroke="#2F6FAE" stroke-width="1.6"/><text x="905.0" y="697.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">API local (BFF) em AWS</text><text x="905.0" y="716.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">Lambda</text><text x="905.0" y="736.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11.5" fill="#E3EEF9" text-anchor="middle">[Python 3.12, FastAPI, Lambda Web</text><text x="905.0" y="751.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11.5" fill="#E3EEF9" text-anchor="middle">Adapter]</text><text x="905.0" y="779.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">Mesmo código; histórico recebido na</text><text x="905.0" y="795.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">requisição; nada gravado</text><rect x="1130" y="380" width="250" height="150" rx="12" fill="#FFFFFF" stroke="#E07B00" stroke-width="2.2"/><text x="1255.0" y="437.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" fill="#232F3E" font-weight="700" text-anchor="middle">AWS Systems Manager</text><text x="1255.0" y="457.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11.5" fill="#4A5563" text-anchor="middle">[Parameter Store, SecureString]</text><text x="1255.0" y="485.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#232F3E" text-anchor="middle">GEMINI_API_KEY</text><rect x="1130" y="670" width="250" height="150" rx="12" fill="#FFFFFF" stroke="#E07B00" stroke-width="2.2"/><text x="1255.0" y="719.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" fill="#232F3E" font-weight="700" text-anchor="middle">Amazon CloudWatch</text><text x="1255.0" y="739.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11.5" fill="#4A5563" text-anchor="middle">[Logs e métricas]</text><text x="1255.0" y="767.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#232F3E" text-anchor="middle">Latência por etapa e erros; sem</text><text x="1255.0" y="783.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#232F3E" text-anchor="middle">conteúdo de fala</text><rect x="1490" y="640" width="200" height="200" rx="12" fill="#7B8089" stroke="#5C6068" stroke-width="1.6"/><text x="1590.0" y="722.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">API Gemini</text><text x="1590.0" y="742.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="11.5" fill="#EEEEEE" text-anchor="middle">[Sistema externo]</text><text x="1590.0" y="770.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">ASR, diálogo e síntese</text><path d="M250,475 L350,475" fill="none" stroke="#4A5568" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M500,550 L500,660" fill="none" stroke="#4A5568" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M650,465 L760,465" fill="none" stroke="#4A5568" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M905,550 L905,640" fill="none" stroke="#4A5568" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1050,680 L1090,680 L1090,455 L1130,455" fill="none" stroke="#4A5568" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1050,745 L1130,745" fill="none" stroke="#4A5568" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M905,840 L905,935 L1590,935 L1590,840" fill="none" stroke="#4A5568" stroke-width="1.7" marker-end="url(#arrow)"/><text x="32.0" y="980.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="13" fill="#2D3748" font-weight="700" text-anchor="start">Legenda</text><rect x="112" y="966" width="34" height="18" rx="4" fill="#0B3B60" stroke="#072A45" stroke-width="1.6"/><text x="154.0" y="980.0" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="12" fill="#2D3748" text-anchor="start">Pessoa</text><rect x="225.76" y="966" width="34" height="18" rx="4" fill="#FFFFFF" stroke="#E07B00" stroke-width="1.6"/><text x